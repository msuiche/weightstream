[workspace]
resolver = "2"
members = [
    "crates/weightstream",
    "crates/weightstream-core",
    "crates/weightstream-cuda",
    "crates/weightstream-gpu",
    "crates/weightstream-ref",
    "crates/weightstream-tokenizer",
    "crates/weightstream-transport",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/msuiche/weightstream"

[profile.release]
lto = "thin"
codegen-units = 1
