[workspace]
resolver = "2"
members = [
    "crates/ferroseek",
    "crates/ferroseek-core",
    "crates/ferroseek-cuda",
    "crates/ferroseek-gpu",
    "crates/ferroseek-ref",
    "crates/ferroseek-tokenizer",
    "crates/ferroseek-transport",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/msuiche/ferroseek"

[profile.release]
lto = "thin"
codegen-units = 1
