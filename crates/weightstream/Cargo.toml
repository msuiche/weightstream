[package]
name = "weightstream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DGX Spark-native inference engine for DeepSeek V4.1 Flash"

[[bin]]
name = "weightstream"
path = "src/main.rs"

[features]
cuda = ["dep:weightstream-gpu", "weightstream-gpu/cuda", "dep:cust"]

[dependencies]
weightstream-core = { path = "../weightstream-core" }
weightstream-ref = { path = "../weightstream-ref" }
weightstream-tokenizer = { path = "../weightstream-tokenizer" }
weightstream-gpu = { path = "../weightstream-gpu", optional = true }
cust = { version = "0.3", optional = true }
serde_json = "1.0.154"
