[package]
name = "weightstream-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPU decode engine for DS4.1F-1017 on GB10 — mirrors weightstream-ref, gated against it"

[features]
cuda = ["weightstream-cuda/cuda", "dep:cust"]

[dependencies]
weightstream-core = { path = "../weightstream-core" }
weightstream-ref = { path = "../weightstream-ref" }
weightstream-cuda = { path = "../weightstream-cuda" }
cust = { version = "0.3", optional = true }
serde_json = "1"
libc = "0.2"
weightstream-transport = { path = "../weightstream-transport" }
rayon = "1.12.0"
