[package]
name = "ferroseek-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPU decode engine for DS4.1F-1017 on GB10 — mirrors ferroseek-ref, gated against it"

[features]
cuda = ["ferroseek-cuda/cuda", "dep:cust"]

[dependencies]
ferroseek-core = { path = "../ferroseek-core" }
ferroseek-ref = { path = "../ferroseek-ref" }
ferroseek-cuda = { path = "../ferroseek-cuda" }
cust = { version = "0.3", optional = true }
serde_json = "1"
libc = "0.2"
ferroseek-transport = { path = "../ferroseek-transport" }
rayon = "1.12.0"
