[package]
name = "weightstream-transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "One-shot RoCE collectives for the 4-node DGX Spark ring (weightstream TP4 transport)"

# Self-contained on purpose (no workspace.* inheritance): the crate is
# rsynced alone to the Spark nodes and built there with the system toolchain.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "weightstream-transport"
path = "src/main.rs"
