[package]
name = "ferroseek"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "DGX Spark-native inference engine for DeepSeek V4.1 Flash"

[[bin]]
name = "ferroseek"
path = "src/main.rs"

[features]
cuda = ["dep:ferroseek-gpu", "ferroseek-gpu/cuda"]

[dependencies]
ferroseek-core = { path = "../ferroseek-core" }
ferroseek-ref = { path = "../ferroseek-ref" }
ferroseek-tokenizer = { path = "../ferroseek-tokenizer" }
ferroseek-gpu = { path = "../ferroseek-gpu", optional = true }
